[package]
name = "horizon-server-manager"
version = "0.1.0"
description = "Local-first Minecraft server manager"
authors = ["Horizon"]
edition = "2021"
build = "build.rs"

[lib]
name = "horizon_server_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "fs", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
get_if_addrs = "0.5"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
